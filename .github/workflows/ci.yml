# Corre `npm run check` (typecheck, lint, formato, tests unitarios y e2e) en cada PR y en main.
# Los tests no usan base de datos ni .env: los repositorios se reemplazan con fakes (ver CLAUDE.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Build de producción
        run: npm run build
